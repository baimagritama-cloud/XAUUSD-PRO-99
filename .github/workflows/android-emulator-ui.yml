name: Android Emulator UI Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-ui:
    name: Six-page portrait and landscape UI test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Android Emulator instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Collect emulator screenshots
        if: always()
        run: |
          mkdir -p artifacts/ui-screenshots
          adb pull /sdcard/Android/data/com.xauusdpro99/files/ui-screenshots artifacts/ui-screenshots || true
          echo "Captured screenshots:"
          find artifacts/ui-screenshots -maxdepth 1 -type f -name '*.png' -printf '%f (%s bytes)\\n' | sort

      - name: Upload UI screenshots and instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-PRO-99-emulator-ui-evidence
          path: |
            artifacts/ui-screenshots/*.png
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 14
