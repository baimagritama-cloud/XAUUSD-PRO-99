name: Android Emulator UI Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-ui:
    name: Six-page portrait and landscape UI test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run tests and collect screenshots while emulator is alive
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            mkdir -p artifacts/diagnostics artifacts/ui-screenshots
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -q '^1$'
            adb shell service check package | grep -q found
            adb shell service check activity | grep -q found
            adb shell cmd package list packages >/dev/null
            adb shell am get-current-user
            adb logcat -c
            test_result=0
            gradle --no-daemon :app:connectedDebugAndroidTest || test_result=$?
            adb logcat -d -v threadtime > artifacts/diagnostics/logcat.txt
            adb shell dumpsys activity processes > artifacts/diagnostics/activity-processes.txt || true
            adb shell dumpsys package com.xauusdpro99 > artifacts/diagnostics/app-package.txt || true
            adb pull /sdcard/Android/data/com.xauusdpro99/files/ui-screenshots artifacts/ui-screenshots || true
            screenshot_count=$(find artifacts/ui-screenshots -maxdepth 1 -type f -name '*.png' | wc -l)
            echo "Instrumentation exit code: $test_result"
            echo "Screenshot count: $screenshot_count"
            test "$test_result" -eq 0 && test "$screenshot_count" -eq 12
            exit "$test_result"

      - name: Upload UI screenshots and instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-PRO-99-emulator-ui-evidence
          path: |
            artifacts/ui-screenshots/*.png
            artifacts/diagnostics/**
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 14
