name: Android Emulator UI Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-ui:
    name: Six-page portrait and landscape UI test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run tests and collect screenshots while emulator is alive
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            sh -c 'mkdir -p artifacts/diagnostics artifacts/ui-screenshots; adb wait-for-device; adb shell getprop sys.boot_completed | grep -q "^1$" || exit 21; adb logcat -c; gradle --no-daemon :app:connectedDebugAndroidTest; result=$?; adb logcat -d -v threadtime > artifacts/diagnostics/logcat.txt; adb shell dumpsys activity processes > artifacts/diagnostics/activity-processes.txt 2>&1; adb shell dumpsys package com.xauusdpro99 > artifacts/diagnostics/app-package.txt 2>&1; adb pull /sdcard/Android/data/com.xauusdpro99/files/ui-screenshots artifacts/ui-screenshots >/dev/null 2>&1 || true; count=$(find artifacts/ui-screenshots -type f -name "*.png" | wc -l); echo "Instrumentation exit code=$result; screenshot count=$count"; if [ "$result" -ne 0 ]; then exit "$result"; fi; [ "$count" -eq 12 ]'
      
      - name: Upload UI screenshots and instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-PRO-99-emulator-ui-evidence
          path: |
            artifacts/ui-screenshots/*.png
            artifacts/diagnostics/**
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 14
