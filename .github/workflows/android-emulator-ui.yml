name: Android Emulator UI Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-ui:
    name: Isolated UI and live-monitoring integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Capture host CPU and memory limits
        shell: bash
        run: |
          mkdir -p artifacts/diagnostics
          {
            echo "=== timestamp ==="
            date -u
            echo "=== logical CPUs ==="
            nproc
            echo "=== free memory ==="
            free -h
            echo "=== host meminfo ==="
            cat /proc/meminfo
            echo "=== cgroup memory limit ==="
            cat /sys/fs/cgroup/memory.max 2>/dev/null || true
            echo "=== cgroup memory current ==="
            cat /sys/fs/cgroup/memory.current 2>/dev/null || true
            echo "=== cgroup CPU quota ==="
            cat /sys/fs/cgroup/cpu.max 2>/dev/null || true
            echo "=== process limits ==="
            ulimit -a
          } > artifacts/diagnostics/host-resource-baseline.txt 2>&1

      - name: Build app, unit tests, and instrumentation APKs
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Verify packaged debug and test manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          "$analyzer" manifest print app/build/outputs/apk/debug/app-debug.apk > artifacts/diagnostics/debug-packaged-manifest.xml
          "$analyzer" manifest print app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk > artifacts/diagnostics/test-packaged-manifest.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ns = '{http://schemas.android.com/apk/res/android}'
          for kind in ('debug', 'test'):
              root = ET.parse(f'artifacts/diagnostics/{kind}-packaged-manifest.xml').getroot()
              names = {p.get(ns+'name') for p in root.findall('./queries/package')}
              assert {'androidx.test.orchestrator', 'androidx.test.services'} <= names, (kind, names)
          PY
          gradle --no-daemon :app:dependencies --configuration debugAndroidTestRuntimeClasspath > artifacts/diagnostics/test-runtime-dependencies.txt

      - name: Detect and enable KVM
        id: acceleration
        shell: bash
        run: |
          if [ -c /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
            echo "disable=false" >> "$GITHUB_OUTPUT"
          else
            echo "disable=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run orchestrated tests and collect diagnostics before emulator teardown
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          emulator-options: -memory 3072 -no-window -gpu swiftshader -no-snapshot -no-audio -no-boot-anim -camera-back none -camera-front none
          disable-linux-hw-accel: ${{ steps.acceleration.outputs.disable }}
          disable-animations: true
          emulator-boot-timeout: 1200
          pre-emulator-launch-script: |
            set -eu
            mkdir -p artifacts/diagnostics artifacts/ui-screenshots
            echo "ANDROID_I_WANT_MY_TCG=${ANDROID_I_WANT_MY_TCG:-unset}" > artifacts/diagnostics/emulator-mode.txt
            "$ANDROID_HOME/emulator/emulator" -version > artifacts/diagnostics/emulator-version.txt 2>&1 || true
            "$ANDROID_HOME/emulator/emulator" -accel-check > artifacts/diagnostics/emulator-acceleration-check.txt 2>&1 || true
            lscpu > artifacts/diagnostics/host-cpu.txt 2>&1 || true
            if [ -f "$ANDROID_AVD_HOME/test.avd/config.ini" ]; then cat "$ANDROID_AVD_HOME/test.avd/config.ini" > artifacts/diagnostics/avd-config.ini; fi
          # Keep shell functions, loops and EXIT traps in one Bash process.
          script: bash .github/scripts/run-emulator-ui-tests.sh

      - name: Upload UI screenshots and full diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-PRO-99-orchestrated-ui-integration-evidence
          path: |
            artifacts/ui-screenshots/**
            artifacts/diagnostics/**
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 14
