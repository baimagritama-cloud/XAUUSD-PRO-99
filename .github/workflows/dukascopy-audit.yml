name: Dukascopy historical source audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/dukascopy-audit.yml'
      - 'scripts/dukascopy-audit.cjs'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install research client
        run: npm install --no-save --ignore-scripts dukascopy-node@1.51.1
      - name: Audit historical XAUUSD without credentials
        run: node scripts/dukascopy-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dukascopy-audit
          path: audit-dukascopy/
