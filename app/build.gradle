plugins { id 'com.android.application' }

android {
    namespace 'com.xauusdpro99'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xauusdpro99'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.microsoft.signalr:signalr:8.0.33'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'org.slf4j:slf4j-jdk14:1.7.36'
}
